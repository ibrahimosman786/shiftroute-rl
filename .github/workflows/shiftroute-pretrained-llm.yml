name: ShiftRoute-RL pretrained LM PPO fine-tuning
on:
  push:
    branches:
      - main
    paths:
      - 'src/shiftroute_rl/llm_trial_v04.py'
      - '.github/workflows/shiftroute-pretrained-llm.yml'
  workflow_dispatch:
jobs:
  pretrained-llm-ppo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch and pretrained-model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.14.0' 'accelerate==1.1.1' 'numpy>=1.26,<3' 'huggingface_hub>=0.25,<1'
          python -m pip install -e .
      - name: Validate tests on cloud
        run: |
          cd .
          python -m unittest discover -s tests -v
      - name: Fine-tune pretrained SmolLM2 policy with SFT and two PPO reward conditions
        run: |
          cd .
          python -m shiftroute_rl.llm_trial_v04 --model HuggingFaceTB/SmolLM2-135M-Instruct \
            --seed 7 --sft-steps 24 --rl-steps 24 --batch 6 --eval 128 \
            --output results/v04/llm-cloud
      - name: Verify outputs are real and complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v04/llm-cloud')
          rows=json.loads((p/'metrics.json').read_text())
          assert len(rows)==3
          assert {x['phase'] for x in rows}=={'after_sft','after_ppo_weak','after_ppo_verified'}
          for x in rows:
              assert x['n']==128 and 0 <= x['unauthorized_approval_rate']<=1
          for name in ('adapter_sft','adapter_ppo_weak','adapter_ppo_verified'):
              assert any((p/name).glob('*.safetensors'))
          print('Pretrained LM fine-tuning artifacts verified')
          PY
      - name: Publish weights and evaluation as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftroute-smollm2-135m-sft-ppo-v04
          path: results/v04/llm-cloud/
          retention-days: 14
          if-no-files-found: warn
